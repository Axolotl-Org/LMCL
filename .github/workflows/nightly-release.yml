name: Nightly Release

on:
  schedule:
    # Runs every day at 18:00 UTC (02:00 in UTC+8). GitHub Actions cron uses UTC only.
    - cron: '0 18 * * *'
  workflow_dispatch:
    inputs:
      force:
        description: Build and publish even if no commit was made after the latest release
        type: boolean
        default: false

# Creating the release (and its tag) needs write access to the repository contents.
permissions:
  contents: write

# Nightly runs must not overlap: two concurrent runs would race on reading the latest release.
concurrency:
  group: nightly-release
  cancel-in-progress: false

jobs:
  check:
    # Only the official repository publishes releases.
    if: ${{ github.repository_owner == 'Axolotl-Org' }}
    runs-on: ubuntu-latest
    outputs:
      has_new_commits: ${{ steps.detect.outputs.has_new_commits }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          # Full history and tags are required to resolve the commit of previous release tags.
          fetch-depth: 0
          fetch-tags: true
      - name: Detect commits since the latest release
        id: detect
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          FORCE: ${{ inputs.force || 'false' }}
        run: |
          head_sha="$(git rev-parse HEAD)"
          echo "HEAD is $head_sha"

          if [ "$FORCE" = "true" ]; then
            echo "Force requested, skipping the commit check"
            echo "has_new_commits=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          last_tag="$(gh release list --limit 1 --exclude-drafts --json tagName --jq '.[0].tagName // ""')"
          if [ -z "$last_tag" ]; then
            echo "No previous release found, building"
            echo "has_new_commits=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if ! git rev-parse --verify --quiet "refs/tags/$last_tag" > /dev/null; then
            # A tag that cannot be resolved locally says nothing about the working tree, so build rather than skip.
            echo "::warning::Tag $last_tag of the latest release is missing locally, assuming new commits"
            echo "has_new_commits=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          last_sha="$(git rev-list -n 1 "refs/tags/$last_tag")"
          echo "Latest release: $last_tag ($last_sha)"
          if [ "$last_sha" = "$head_sha" ]; then
            echo "No commits since $last_tag, nothing to publish"
            echo "has_new_commits=false" >> "$GITHUB_OUTPUT"
          else
            echo "Commits found since $last_tag"
            echo "has_new_commits=true" >> "$GITHUB_OUTPUT"
          fi

  release:
    needs: check
    if: ${{ needs.check.outputs.has_new_commits == 'true' }}
    runs-on: ubuntu-latest
    env:
      # Nightly builds are published as a prerelease of the nightly channel.
      VERSION_TYPE: nightly
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          fetch-tags: true
      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: 'liberica'
          java-version: '17'
          java-package: 'jdk+fx'
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v5
        with:
          cache-cleanup: never
      - name: Build jar
        env:
          MICROSOFT_AUTH_ID: ${{ secrets.MICROSOFT_AUTH_ID }}
          CURSEFORGE_API_KEY: ${{ secrets.CURSEFORGE_API_KEY }}
        run: ./gradlew clean makeExecutables --no-daemon --stacktrace
      - name: Read version
        run: |
          jar_file="$(ls HMCL/build/libs/HMCL-*.jar)"
          version="$(basename "$jar_file" .jar)"
          version="${version#HMCL-}"
          echo "HMCL_VERSION=$version" >> "$GITHUB_ENV"
          echo "HMCL_TAG_NAME=v$version" >> "$GITHUB_ENV"
      - name: Generate release note
        run: |
          download_base_url="https://github.com/${GITHUB_REPOSITORY}/releases/download/${HMCL_TAG_NAME}"
          file="HMCL-${HMCL_VERSION}.jar"
          checksum="$(cat "HMCL/build/libs/$file.sha256")"
          {
            echo "Nightly build of commit [\`${GITHUB_SHA::7}\`](https://github.com/${GITHUB_REPOSITORY}/commit/${GITHUB_SHA})."
            echo ""
            echo "| File | SHA-256 Checksum |"
            echo "| --- | --- |"
            echo "| [$file]($download_base_url/$file) | \`$checksum\` |"
          } > RELEASE_NOTE
          cat RELEASE_NOTE
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "$HMCL_TAG_NAME" \
            "HMCL/build/libs/HMCL-${HMCL_VERSION}.jar" \
            "HMCL/build/libs/HMCL-${HMCL_VERSION}.jar.sha256" \
            --target "$GITHUB_SHA" \
            --title "$HMCL_TAG_NAME" \
            --notes-file RELEASE_NOTE \
            --prerelease
