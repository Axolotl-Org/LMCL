name: Create Release

on:
  workflow_dispatch:
    inputs:
      channel:
        description: Release channel
        type: choice
        options:
          - dev
          - stable
        default: dev

permissions:
  contents: write

jobs:
  release:
    # Only the official repository publishes releases.
    if: ${{ github.repository_owner == 'Axolotl-Org' }}
    runs-on: ubuntu-latest
    env:
      VERSION_TYPE: ${{ inputs.channel }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          fetch-tags: true
      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: 'liberica'
          java-version: '17'
          java-package: 'jdk+fx'
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v5
        with:
          cache-cleanup: never
      - name: Build distributables
        env:
          MICROSOFT_AUTH_ID: ${{ secrets.MICROSOFT_AUTH_ID }}
          CURSEFORGE_API_KEY: ${{ secrets.CURSEFORGE_API_KEY }}
        run: ./gradlew clean makeExecutables makeDeb --no-daemon --stacktrace
      - name: Read version
        run: |
          jar_file="$(ls HMCL/build/libs/HMCL-*.jar)"
          version="$(basename "$jar_file" .jar)"
          version="${version#HMCL-}"
          echo "HMCL_VERSION=$version" >> "$GITHUB_ENV"
          echo "HMCL_TAG_NAME=v$version" >> "$GITHUB_ENV"
      - name: Check for existing tag
        run: |
          if git rev-parse --verify --quiet "refs/tags/$HMCL_TAG_NAME" > /dev/null; then
            echo "::error::Tag $HMCL_TAG_NAME already exists"
            exit 1
          fi
      - name: Generate release note
        run: |
          download_base_url="https://github.com/${GITHUB_REPOSITORY}/releases/download/${HMCL_TAG_NAME}"
          {
            echo "**[Changelog](https://github.com/${GITHUB_REPOSITORY}/releases)** (Chinese)"
            echo ""
            echo "| File | SHA-256 Checksum |"
            echo "| --- | --- |"
            for ext in exe jar sh deb; do
              file="HMCL-${HMCL_VERSION}.$ext"
              checksum="$(cat "HMCL/build/libs/$file.sha256")"
              echo "| [$file]($download_base_url/$file) | \`$checksum\` |"
            done
          } > RELEASE_NOTE
          cat RELEASE_NOTE
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          args=(--target "$GITHUB_SHA" --title "$HMCL_TAG_NAME" --notes-file RELEASE_NOTE)
          if [ "$VERSION_TYPE" = "dev" ]; then
            args+=(--prerelease)
          fi
          gh release create "$HMCL_TAG_NAME" \
            "HMCL/build/libs/HMCL-${HMCL_VERSION}.exe" \
            "HMCL/build/libs/HMCL-${HMCL_VERSION}.jar" \
            "HMCL/build/libs/HMCL-${HMCL_VERSION}.sh" \
            "HMCL/build/libs/HMCL-${HMCL_VERSION}.deb" \
            "${args[@]}"
